<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4" />

  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">정적 NAT (Static NAT): 1:1 고정 매핑</text>

  <!-- 고정 연결선 (영구적 관계 상징) -->
  <line x1="150" y1="300" x2="650" y2="300" stroke="#e5e5e5" stroke-width="8" stroke-linecap="round" />
  <line x1="150" y1="300" x2="650" y2="300" stroke="#737373" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />
  <text x="400" y="260" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#737373">영구적 1:1 매핑 경로</text>

  <!-- 왼쪽: 사설 IP (집) -->
  <g transform="translate(110, 260)">
    <path d="M40 0 L80 35 H0 Z" fill="#e5e5e5" stroke="#0a0a0a" stroke-width="2"/>
    <rect x="10" y="35" width="60" height="45" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"/>
    <rect x="30" y="55" width="20" height="25" fill="#0a0a0a"/>
    <text x="40" y="100" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#0a0a0a">사설 IP</text>
    <text x="40" y="120" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373">192.168.1.10</text>
  </g>

  <!-- 오른쪽: 공인 IP (빌딩) -->
  <g transform="translate(610, 240)">
    <rect x="0" y="0" width="80" height="100" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"/>
    <rect x="15" y="15" width="15" height="15" fill="#e5e5e5"/>
    <rect x="50" y="15" width="15" height="15" fill="#e5e5e5"/>
    <rect x="15" y="45" width="15" height="15" fill="#e5e5e5"/>
    <rect x="50" y="45" width="15" height="15" fill="#e5e5e5"/>
    <rect x="30" y="75" width="20" height="25" fill="#0a0a0a"/>
    <text x="40" y="120" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#0a0a0a">공인 IP</text>
    <text x="40" y="140" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373">203.0.113.10</text>
  </g>

  <!-- 중앙: NAT 라우터 -->
  <g transform="translate(360, 260)">
    <circle cx="40" cy="40" r="35" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
    <path d="M20 40 H60 M50 30 L60 40 L50 50 M30 30 L20 40 L30 50" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <text x="40" y="95" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#2563eb">NAT 장비</text>
  </g>

  <!-- 데이터 패킷 애니메이션 -->
  <g>
    <!-- 패킷 본체 -->
    <rect x="-25" y="-15" width="50" height="30" rx="4" fill="#737373">
      <animate attributeName="fill" 
               values="#737373;#737373;#2563eb;#2563eb;#2563eb;#737373;#737373" 
               dur="6s" repeatCount="indefinite" />
    </rect>
    <!-- 패킷 텍스트 -->
    <text y="2" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#ffffff">DATA</text>
    
    <animateMotion 
      path="M 150 300 H 400 H 650 M 650 300 H 400 H 150" 
      dur="6s" 
      repeatCount="indefinite" 
      keyTimes="0; 0.3; 0.5; 0.6; 0.8; 1"
      calcMode="linear" />
  </g>

  <!-- 하단 설명 -->
  <rect x="200" y="500" width="400" height="40" rx="20" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="400" y="525" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#0a0a0a">
    특정 사설 IP와 공인 IP가 <tspan fill="#2563eb" font-weight="700">1:1로 항상 고정</tspan>되어 통신합니다.
  </text>
</svg>