<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4" />

  <!-- 제목 -->
  <text x="400" y="44" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a" text-anchor="middle">vPC (virtual Port Channel) 이중화 및 부하 분산</text>

  <!-- vPC 도메인 영역 표시 -->
  <rect x="160" y="100" width="480" height="160" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2" stroke-dasharray="8,4" />
  <text x="400" y="120" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">vPC 도메인 (논리적 단일 스위치)</text>

  <!-- Peer Link -->
  <line x1="320" y1="180" x2="480" y2="180" stroke="#737373" stroke-width="4" stroke-dasharray="8,8" />
  <text x="400" y="170" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">Peer Link</text>

  <!-- Nexus Switch 1 -->
  <g id="nexus1" transform="translate(200, 150)">
    <rect width="120" height="60" rx="4" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2" />
    <text x="60" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle">Nexus Switch 1</text>
  </g>

  <!-- Nexus Switch 2 -->
  <g id="nexus2" transform="translate(480, 150)">
    <rect width="120" height="60" rx="4" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2">
      <animate attributeName="stroke" values="#0a0a0a;#0a0a0a;#e11d48;#e11d48" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;0.4;1" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle">Nexus Switch 2</text>
    <!-- 장애 표시 X -->
    <g opacity="0">
      <line x1="40" y1="15" x2="80" y2="45" stroke="#e11d48" stroke-width="4" stroke-linecap="round" />
      <line x1="80" y1="15" x2="40" y2="45" stroke="#e11d48" stroke-width="4" stroke-linecap="round" />
      <animate attributeName="opacity" values="0;0;1;0" dur="8s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Downstream Switch -->
  <g id="downstream" transform="translate(340, 420)">
    <rect width="120" height="60" rx="4" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2" />
    <text x="60" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle">하위 스위치</text>
  </g>

  <!-- vPC Member Ports (Links) -->
  <!-- Link 1 (Left) -->
  <line x1="400" y1="420" x2="260" y2="210" stroke="#0a0a0a" stroke-width="3" />
  <!-- Link 2 (Right) -->
  <line x1="400" y1="420" x2="540" y2="210" stroke="#0a0a0a" stroke-width="3">
    <animate attributeName="stroke" values="#0a0a0a;#0a0a0a;#e5e5e5;#0a0a0a" dur="8s" repeatCount="indefinite" />
    <animate attributeName="stroke-dasharray" values="0;0;4,4;0" dur="8s" repeatCount="indefinite" />
  </line>
  
  <text x="400" y="330" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">vPC 멤버 포트 (논리적 포트 채널)</text>

  <!-- 데이터 패킷 애니메이션 (Left Path) -->
  <circle r="6" fill="#7c3aed">
    <animateMotion path="M 400 420 L 260 210" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle r="6" fill="#7c3aed">
    <animateMotion path="M 400 420 L 260 210" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <circle r="6" fill="#7c3aed">
    <animateMotion path="M 400 420 L 260 210" dur="1.5s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- 데이터 패킷 애니메이션 (Right Path - 장애 시 중단) -->
  <g>
    <circle r="6" fill="#7c3aed">
      <animateMotion path="M 400 420 L 540 210" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#7c3aed">
      <animateMotion path="M 400 420 L 540 210" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#7c3aed">
      <animateMotion path="M 400 420 L 540 210" dur="1.5s" begin="1s" repeatCount="indefinite" />
    </circle>
    <animate attributeName="opacity" values="1;1;0;1" dur="8s" repeatCount="indefinite" />
  </g>

  <!-- 상태 설명 라벨 -->
  <g transform="translate(400, 540)">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#ffffff" stroke="#e5e5e5" />
    <text font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle">
      <tspan>
        <animate attributeName="opacity" values="1;1;0;0;1" dur="8s" repeatCount="indefinite" />
        액티브-액티브 부하 분산 중
      </tspan>
      <tspan x="0">
        <animate attributeName="opacity" values="0;0;1;1;0" dur="8s" repeatCount="indefinite" />
        장애 발생: 즉시 경로 우회 (고가용성)
      </tspan>
    </text>
  </g>
</svg>